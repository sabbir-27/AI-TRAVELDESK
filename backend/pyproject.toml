[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-traveldesk-backend"
version = "0.1.0"
description = "AI TravelDesk Multi-Tenant B2B Travel Agency Operating Platform Backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.32.0,<1.0.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.35,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "alembic>=1.14.0,<2.0.0",
  "redis>=5.2.0,<6.0.0",
  "pyjwt>=2.9.0,<3.0.0",
  "pwdlib[argon2]>=0.2.1,<1.0.0",
  "cryptography>=43.0.0,<46.0.0",
  "structlog>=24.4.0,<26.0.0",
  "langgraph>=0.2.50,<1.0.0",
  "langchain-core>=0.3.15,<1.0.0",
  "langchain-openai>=0.2.8,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "ruff>=0.7.0,<1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

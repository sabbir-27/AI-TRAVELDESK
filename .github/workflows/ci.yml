name: CI — AI TravelDesk

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend Lint & Test (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Run Ruff lint
        run: ruff check app tests

      - name: Run Pytest suite
        run: pytest -v

  frontend:
    name: Frontend Typecheck, Test & Build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest suite
        run: npm run test

      - name: Next.js production build
        run: npm run build

  docker-compose-validate:
    name: Validate Docker Compose Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate prod compose syntax
        env:
          POSTGRES_PASSWORD: ci-dummy-postgres-password
          JWT_SECRET_KEY: ci-dummy-jwt-secret-with-more-than-32-chars
          ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GRAFANA_ADMIN_PASSWORD: ci-dummy-grafana-password
        run: docker compose -f docker-compose.prod.yml config -q

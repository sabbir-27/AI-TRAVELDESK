groups:
  - name: ai_traveldesk_slo_alerts
    rules:
      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 1) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "AI TravelDesk backend 5xx error rate above 5%"
          description: "More than 5% of HTTP requests returned 5xx over the last 5 minutes."

      - alert: BackendHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI TravelDesk API P95 latency exceeds 1.5s"
          description: "95th percentile backend response latency exceeded 1.5s over 5 minutes."
